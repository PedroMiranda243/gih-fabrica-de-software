[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# As migrações são geradas pelo Alembic: reformatar à mão a cada autogenerate
# só cria ruído no diff. As demais regras continuam valendo nelas.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"migrations/env.py" = ["E402"]
