# A borda do acesso remoto (ADR-014, RNF30, H102).
#
# O navegador de fora vê um endereço só, como o de dentro: a interface e o `/api`
# na mesma origem. É o que mantém o cookie de sessão em `SameSite=Lax` e a API
# sem CORS — o mesmo motivo do proxy em `web/vite.config.js`.
#
# Esta porta não é publicada na máquina. Só o contêiner `tailscale` chega aqui,
# pela rede do Compose.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A versão do servidor não precisa ir na resposta.
    server_tokens off;

    # Valem para tudo que sai daqui. Um `add_header` dentro de um `location`
    # apagaria estes três: por isso nenhum `location` abaixo usa `add_header`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A API, pela rede do Compose. Só o `/api`: a documentação interativa da API
    # (`/docs`, `/openapi.json`) fica na porta dela, presa à máquina, e não passa
    # por aqui.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # A API já manda o `nosniff` dela; com o daqui, o cabeçalho sairia duas
        # vezes. Fica o da borda, que vale para tudo.
        proxy_hide_header X-Content-Type-Options;

        # A pergunta ao assistente pode levar até 180 s (ADR-013): o limite daqui
        # fica acima do dela, para a resposta lenta não virar erro de proxy.
        proxy_read_timeout 300s;

        # Quem recusa a entrada grande demais é a API, com a mensagem em português
        # (RNF15). Este teto fica acima do dela, só para o que é absurdo.
        client_max_body_size 2m;

        # Quem chega aqui chegou por HTTPS, e o cookie de sessão sai com `Secure`.
        # A marca é posta na borda, e não na API (`COOKIE_SEGURO`), porque a API é
        # a mesma para o acesso local, que continua em HTTP.
        proxy_cookie_flags gih_sessao secure;
    }

    # O nome destes arquivos traz o hash do conteúdo: mudou o arquivo, mudou o
    # nome. Podem ficar um ano no cache do aparelho.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # A página, ao contrário, tem sempre o mesmo nome e aponta para os arquivos da
    # vez: o aparelho confere antes de reusar.
    location = /index.html {
        expires -1;
    }

    # As rotas são do navegador (`BrowserRouter`): `/parceiros/12` não é arquivo,
    # e quem responde é a página, que abre a tela certa.
    location / {
        try_files $uri /index.html;
    }
}
