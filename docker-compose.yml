# Ambiente completo do GIH: um comando sobe tudo (RNF07).
#   docker compose up

services:
  postgres:
    image: postgres:16-alpine
    # Os três serviços voltam sozinhos quando o Docker volta. Sem isto, cada
    # vez que o Docker Desktop reiniciava — e nesta máquina ele reinicia sozinho
    # quando fica ocioso — os contêineres ficavam parados com "exited", e a
    # aplicação só voltava com um `docker compose up` à mão. Aconteceu três
    # vezes numa semana; no dia da demonstração, não pode acontecer.
    #
    # `unless-stopped`, e não `always`: quem para de propósito com `docker
    # compose stop` continua parado depois de reiniciar a máquina.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gih}
      POSTGRES_DB: ${POSTGRES_DB:-gih}
    # Preso ao localhost: o banco não deve ficar exposto na rede (RNF14).
    # A porta do host é configurável porque 5432 costuma já estar ocupada por
    # outro Postgres na máquina de quem desenvolve.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gih} -d ${POSTGRES_DB:-gih}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      # O modelo preditivo (`modelo/`) e o otimizador serial (`nucleo/`) rodam
      # dentro da API, mas moram fora dela.
      # Entra como contexto adicional, e não trocando o contexto para a raiz:
      # a raiz levaria web/node_modules e docs/ para o build (ADR-010).
      additional_contexts:
        modelo: ./modelo
        nucleo: ./nucleo
        # Só o gerador de dados entra, para o `popular-demonstracao` (H72).
        scripts: ./scripts
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gih}:${POSTGRES_PASSWORD:-gih}@postgres:5432/${POSTGRES_DB:-gih}
      # O filtro por data da auditoria usa o dia do relógio de quem consulta.
      # Sem isto o contêiner roda em UTC e "hoje" perde o que aconteceu depois
      # das 21h no horário local.
      TZ: ${TZ:-America/Recife}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-false}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      # O modelo de linguagem (ADR-013). Sem o perfil `assistente`, o serviço
      # abaixo não sobe, o endereço não responde, e o sistema funciona igual:
      # as mensagens saem do modelo fixo, e o assistente se diz indisponível.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # A interface. Fecha a metade da H09 que faltava: "docker compose up sobe API,
  # banco **e interface**". O navegador fala só com ela; o `/api` é repassado
  # ao serviço acima pela rede do compose, e é por isso que o cookie de sessão
  # funciona sem abrir CORS na API — ver web/vite.config.js.
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  # O modelo de linguagem local (ADR-013): opcional, e por isso num perfil. Só
  # sobe com `docker compose --profile assistente up -d`; sem o perfil, o
  # Compose nem baixa a imagem, que tem ~8 GB.
  #
  # **A porta não é publicada no host, de propósito.** O Ollama não tem
  # autenticação: publicado, qualquer programa da máquina usaria o modelo. A
  # API o alcança pela rede do Compose.
  #
  # Com placa NVIDIA, o `docker-compose.gpu.yml` reserva a placa também para
  # ele. Sem placa, o modelo roda na CPU — bem mais devagar, mas roda.
  ollama:
    image: ollama/ollama:0.32.5
    profiles: ["assistente"]
    restart: unless-stopped
    volumes:
      - modelos_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Baixa o modelo na primeira subida (~4,7 GB) e sai; nas seguintes, confere
  # que ele está lá e sai na hora. O `qwen2.5:7b` é Apache 2.0 (regra 2.8).
  ollama-modelo:
    image: ollama/ollama:0.32.5
    profiles: ["assistente"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:7b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # O acesso de fora da máquina (ADR-014, RNF30, H102): opcional, e por isso num
  # perfil. Só sobe com `docker compose --profile remoto up -d`; sem o perfil,
  # nada abaixo existe, e o sistema continua alcançável só por esta máquina.
  #
  # São dois serviços. Este entrega a interface empacotada e repassa o `/api` —
  # quem chega de fora não recebe o servidor de desenvolvimento do serviço `web`.
  #
  # **A porta não é publicada no host, de propósito.** Só o serviço `tailscale`
  # chega aqui, pela rede do Compose.
  borda:
    build:
      context: ./web
      dockerfile: ../remoto/Dockerfile
      additional_contexts:
        remoto: ./remoto
    profiles: ["remoto"]
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # O nó da rede privada (Tailscale, cliente BSD-3). É por ele, e só por ele, que
  # um aparelho de fora chega ao sistema: por WireGuard, e só os aparelhos da
  # conta de quem opera, ou os que essa pessoa convidou.
  #
  # **Não é um túnel público.** O `AllowFunnel: false` abaixo é o que separa as
  # duas coisas: o endereço só responde dentro da rede privada. Um link aberto na
  # internet foi avaliado e recusado — o porquê está na ADR-014.
  #
  # Nenhuma porta publicada aqui também, e a máquina não entra na rede: só este
  # contêiner. Quem está na rede alcança a 443 dele, e mais nada.
  #
  # Na primeira subida, o log traz o endereço para autorizar o nó na conta:
  #   docker compose --profile remoto logs tailscale
  # A identidade fica no volume, e as subidas seguintes entram sozinhas. A
  # `TS_AUTHKEY` é a alternativa, e só no `.env` — nunca neste arquivo.
  tailscale:
    image: tailscale/tailscale:v1.102.5
    profiles: ["remoto"]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-gih}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-gih}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Com a identidade no volume, não pede autorização de novo a cada subida.
      TS_AUTH_ONCE: "true"
    configs:
      - source: tailscale_serve
        target: /serve.json
    volumes:
      - estado_tailscale:/var/lib/tailscale
    depends_on:
      borda:
        condition: service_healthy

# O que o nó serve: HTTPS na 443, tudo para a borda, e só para a rede privada.
# Embutido aqui, e não num arquivo montado: o caminho deste repositório tem
# acento, e a montagem de arquivo é o que mais quebra por isso. O `$$` é o `$`
# literal — quem troca o `TS_CERT_DOMAIN` pelo nome do nó é o contêiner.
configs:
  tailscale_serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://borda:8080" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": false }
      }

volumes:
  dados_postgres:
  modelos_ollama:
  estado_tailscale:
