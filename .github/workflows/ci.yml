name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  higiene-do-repositorio:
    name: Higiene do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nenhum arquivo .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' | grep -v '\.env\.example$'; then
            echo "::error::Arquivo de ambiente versionado. Segredos vão em .env, que está no .gitignore."
            exit 1
          fi
          echo "OK — nenhum .env versionado."

      - name: Nenhum arquivo de dados versionado
        run: |
          if git ls-files | grep -Ei '\.(csv|xlsx|xls)$' | grep -v '^scripts/exemplos/'; then
            echo "::error::Arquivo de dados versionado. Toda massa de demonstração é gerada por scripts/gerar_dados_sinteticos.py."
            exit 1
          fi
          echo "OK — nenhum arquivo de dados versionado."

      - name: Nenhum segredo aparente no código
        run: |
          if git grep -nEi "(api[_-]?key|secret|token|password)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9_/+.-]{16,}['\"]" -- . ':!.github/workflows/*' ':!*.example'; then
            echo "::error::Possível segredo literal no código."
            exit 1
          fi
          echo "OK — nenhum segredo aparente."

      - name: Documentação obrigatória presente
        run: |
          for f in README.md CONTRIBUTING.md \
                   docs/01-visao-do-produto.md docs/02-requisitos.md \
                   docs/03-casos-de-uso.md docs/04-product-backlog.md \
                   docs/05-cronograma.md docs/06-equipe-e-processo.md \
                   docs/07-arquitetura-preliminar.md; do
            test -f "$f" || { echo "::error::Documento ausente: $f"; exit 1; }
          done
          echo "OK — documentação completa."

  api:
    name: API (Python)
    runs-on: ubuntu-latest

    # Os testes da API rodam contra um Postgres de verdade, nao contra SQLite:
    # o modelo usa JSONB, tipos ENUM e restricoes CHECK, e nenhum deles existe
    # em SQLite. Teste que nao exercita a restricao nao prova que ela esta la.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gih
          POSTGRES_PASSWORD: gih
          POSTGRES_DB: gih
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o módulo já existe
        id: existe
        run: |
          if [ -d api ]; then echo "pronto=sim" >> "$GITHUB_OUTPUT"; else echo "pronto=nao" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.existe.outputs.pronto == 'sim'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            modelo/requirements.txt

      # A API treina e prevê com o pacote do modelo (ADR-010): sem ele, os
      # testes do módulo de previsão não teriam o que chamar.
      - name: Instalar dependências
        if: steps.existe.outputs.pronto == 'sim'
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r modelo/requirements.txt
          pip install --no-deps ./modelo

      - name: Análise estática
        if: steps.existe.outputs.pronto == 'sim'
        working-directory: api
        run: ruff check .

      - name: Testes
        if: steps.existe.outputs.pronto == 'sim'
        working-directory: api
        env:
          # O conftest cria um banco `<nome>_teste` separado a partir desta URL
          # e aplica as migracoes nele com `alembic upgrade head`.
          DATABASE_URL: postgresql+psycopg://gih:gih@localhost:5432/gih
        run: pytest --cov=app --cov-report=term-missing

      # O núcleo de regras tem um piso próprio, e reprova o PR que o furar
      # (RNF24, história H69). A H69 nomeia segmentação, ranking, previsão e
      # otimização; a previsão entrou com o módulo da Sprint 05. Cobertura que
      # não é cobrada decai: o número medido na segmentação era 99%, e o piso
      # fica no que o requisito exige, 70% — largo
      # de propósito, porque piso colado no valor atual reprova por qualquer
      # refatoração honesta.
      #
      # **Relê os dados do passo anterior**, em vez de rodar a suíte de novo.
      # A primeira versão rodava, e o trabalho da API foi de 1m30 para 3m12 —
      # o dobro de CI para conferir um número que já estava medido.
      - name: Cobertura do núcleo de regras
        if: steps.existe.outputs.pronto == 'sim'
        working-directory: api
        run: >-
          coverage report
          --include=app/servico_segmentacao.py,app/ranking.py,app/rotas/painel.py,app/calculos.py,app/servico_previsao.py
          --fail-under=70

      - name: Módulo ainda não criado
        if: steps.existe.outputs.pronto == 'nao'
        run: echo "Diretório api/ ainda não existe — previsto para a Sprint 3 (história H09)."

  modelo:
    name: Modelo preditivo (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O cache importa aqui mais que nos outros trabalhos: a roda CPU do
      # PyTorch é a maior dependência do repositório, e baixá-la a cada push
      # custaria mais que rodar os testes.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: modelo/requirements.txt

      # pytest e ruff nas mesmas versões de api/requirements-dev.txt. Aquele
      # arquivo não serve inteiro: traria a API toda para testar um pacote que
      # não a conhece.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r modelo/requirements.txt pytest==8.3.4 ruff==0.8.4
          pip install --no-deps -e modelo

      - name: Análise estática
        working-directory: modelo
        run: ruff check .

      - name: Testes
        working-directory: modelo
        run: pytest

  nucleo:
    name: Otimizador (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # O pacote não tem dependência (ADR-011: o baseline é Python puro), e o
      # `nucleo/requirements.txt` é do spike de GPU — instalá-lo traria o CuPy
      # para testar código que não o usa.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 ruff==0.8.4
          pip install --no-deps -e nucleo

      - name: Análise estática
        working-directory: nucleo
        run: ruff check .

      - name: Testes
        working-directory: nucleo
        run: pytest

  web:
    name: Interface (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o módulo já existe
        id: existe
        run: |
          if [ -f web/package.json ]; then echo "pronto=sim" >> "$GITHUB_OUTPUT"; else echo "pronto=nao" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.existe.outputs.pronto == 'sim'
        with:
          # 22, e não 20: o Node 20 saiu de suporte em abril de 2026, e a cadeia de
          # teste da interface (jsdom, vitest) exige 22. É também o runtime do
          # web/Dockerfile — a CI testa onde a interface roda.
          node-version: '22'

      - name: Instalar, verificar e testar
        if: steps.existe.outputs.pronto == 'sim'
        working-directory: web
        run: |
          npm ci
          npm run lint --if-present
          npm run test --if-present
          npm run build

      - name: Módulo ainda não criado
        if: steps.existe.outputs.pronto == 'nao'
        run: echo "Diretório web/ ainda não existe — previsto para a Sprint 3 (história H09)."
