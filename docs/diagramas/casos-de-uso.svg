<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 750" width="1210" height="750" role="img" aria-label="Diagrama de casos de uso do Growth Intelligence Hub">
  <title>Diagrama de casos de uso — Growth Intelligence Hub</title>

  <style>
    .bg      { fill: #f6f8fb; }
    .bound   { fill: #ffffff; stroke: #1f3a5f; stroke-width: 2; }
    .uc      { fill: #eaf2fb; stroke: #2c5b8f; stroke-width: 1.6; }
    .uc-core { fill: #e6f4ec; stroke: #2c7a56; stroke-width: 2.2; }
    .uc-all  { fill: #fdf3e3; stroke: #b07d2a; stroke-width: 1.8; }
    .uc-cond { fill: #f4f6f8; stroke: #93a2b4; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .assoc   { stroke: #8d9bad; stroke-width: 1.3; fill: none; }
    .actor   { stroke: #1f3a5f; stroke-width: 2; fill: none; stroke-linecap: round; }
    .head    { fill: #ffffff; stroke: #1f3a5f; stroke-width: 2; }
    text     { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #16283f; }
    .t-uc    { font-size: 12.5px; text-anchor: middle; }
    .t-core  { font-size: 12.5px; text-anchor: middle; fill: #1c4a35; font-weight: 600; }
    .t-cond  { font-size: 12.5px; text-anchor: middle; fill: #5b6b7e; }
    .t-actor { font-size: 13.5px; text-anchor: middle; font-weight: 600; }
    .t-sys   { font-size: 14px; font-weight: 700; fill: #1f3a5f; letter-spacing: .6px; }
    .t-title { font-size: 19px; text-anchor: middle; font-weight: 700; fill: #16283f; }
    .t-leg   { font-size: 11.5px; fill: #4a5a6e; }
  </style>

  <rect class="bg" x="0" y="0" width="1210" height="750"/>
  <text class="t-title" x="605" y="34">Casos de Uso — Growth Intelligence Hub (GIH)</text>

  <!-- Fronteira do sistema -->
  <rect class="bound" x="250" y="62" width="720" height="598" rx="10"/>
  <text class="t-sys" x="272" y="86">GROWTH INTELLIGENCE HUB</text>

  <!-- Associações: Administrador -->
  <line class="assoc" x1="174" y1="262" x2="280" y2="183"/>
  <line class="assoc" x1="174" y1="262" x2="280" y2="255"/>
  <line class="assoc" x1="174" y1="262" x2="280" y2="327"/>
  <line class="assoc" x1="174" y1="254" x2="460" y2="126"/>

  <!-- Associações: Gestor -->
  <line class="assoc" x1="174" y1="552" x2="280" y2="399"/>
  <line class="assoc" x1="174" y1="552" x2="280" y2="471"/>
  <line class="assoc" x1="174" y1="552" x2="280" y2="543"/>
  <line class="assoc" x1="174" y1="552" x2="280" y2="615"/>

  <!-- Associações: Analista -->
  <line class="assoc" x1="1051" y1="372" x2="940" y2="255"/>
  <line class="assoc" x1="1051" y1="372" x2="940" y2="327"/>
  <line class="assoc" x1="1051" y1="372" x2="940" y2="471"/>

  <!-- Associações: Parceiro -->
  <line class="assoc" x1="1051" y1="612" x2="940" y2="615"/>

  <!-- UC01 — comum a todos os perfis -->
  <ellipse class="uc-all" cx="610" cy="122" rx="150" ry="26"/>
  <text class="t-uc" x="610" y="119">UC01 · Autenticar no sistema</text>
  <text class="t-uc" x="610" y="134" font-size="10.5" fill="#7a5a14">«todos os perfis»</text>

  <!-- Coluna esquerda: Administrador e Gestor -->
  <ellipse class="uc" cx="420" cy="183" rx="140" ry="26"/>
  <text class="t-uc" x="420" y="188">UC02 · Gerenciar usuários e perfis</text>

  <ellipse class="uc" cx="420" cy="255" rx="140" ry="26"/>
  <text class="t-uc" x="420" y="260">UC14 · Auditar ações do sistema</text>

  <ellipse class="uc" cx="420" cy="327" rx="140" ry="26"/>
  <text class="t-uc" x="420" y="332">UC07 · Treinar modelo de previsão</text>

  <ellipse class="uc" cx="420" cy="399" rx="140" ry="26"/>
  <text class="t-uc" x="420" y="404">UC05 · Consultar painel e ranking</text>

  <ellipse class="uc" cx="420" cy="471" rx="140" ry="26"/>
  <text class="t-uc" x="420" y="476">UC06 · Mobilidade do Top N</text>

  <ellipse class="uc-core" cx="420" cy="543" rx="140" ry="26"/>
  <text class="t-core" x="420" y="548">UC08 · Otimizar campanha</text>

  <ellipse class="uc-core" cx="420" cy="615" rx="140" ry="26"/>
  <text class="t-core" x="420" y="613">UC09 · Comparar serial,</text>
  <text class="t-core" x="420" y="627">paralelo e GPU</text>

  <!-- Coluna direita: Analista e Parceiro -->
  <ellipse class="uc" cx="800" cy="255" rx="140" ry="26"/>
  <text class="t-uc" x="800" y="260">UC03 · Importar relatório</text>

  <ellipse class="uc" cx="800" cy="327" rx="140" ry="26"/>
  <text class="t-uc" x="800" y="332">UC04 · Gerenciar parceiros</text>

  <ellipse class="uc-cond" cx="800" cy="471" rx="140" ry="26"/>
  <text class="t-cond" x="800" y="468">UC12 · Consultar assistente</text>
  <text class="t-cond" x="800" y="482" font-size="10.5">«condicional»</text>

  <ellipse class="uc" cx="800" cy="615" rx="140" ry="26"/>
  <text class="t-uc" x="800" y="620">UC13 · Consultar meu desempenho</text>

  <!-- Ator: Administrador -->
  <circle class="head" cx="150" cy="250" r="13"/>
  <line class="actor" x1="150" y1="263" x2="150" y2="300"/>
  <line class="actor" x1="126" y1="278" x2="174" y2="278"/>
  <line class="actor" x1="150" y1="300" x2="134" y2="326"/>
  <line class="actor" x1="150" y1="300" x2="166" y2="326"/>
  <text class="t-actor" x="150" y="346">Administrador</text>

  <!-- Ator: Gestor -->
  <circle class="head" cx="150" cy="540" r="13"/>
  <line class="actor" x1="150" y1="553" x2="150" y2="590"/>
  <line class="actor" x1="126" y1="568" x2="174" y2="568"/>
  <line class="actor" x1="150" y1="590" x2="134" y2="616"/>
  <line class="actor" x1="150" y1="590" x2="166" y2="616"/>
  <text class="t-actor" x="150" y="636">Gestor</text>

  <!-- Ator: Analista -->
  <circle class="head" cx="1075" cy="360" r="13"/>
  <line class="actor" x1="1075" y1="373" x2="1075" y2="410"/>
  <line class="actor" x1="1051" y1="388" x2="1099" y2="388"/>
  <line class="actor" x1="1075" y1="410" x2="1059" y2="436"/>
  <line class="actor" x1="1075" y1="410" x2="1091" y2="436"/>
  <text class="t-actor" x="1075" y="456">Analista</text>

  <!-- Ator: Parceiro -->
  <circle class="head" cx="1075" cy="600" r="13"/>
  <line class="actor" x1="1075" y1="613" x2="1075" y2="650"/>
  <line class="actor" x1="1051" y1="628" x2="1099" y2="628"/>
  <line class="actor" x1="1075" y1="650" x2="1059" y2="676"/>
  <line class="actor" x1="1075" y1="650" x2="1091" y2="676"/>
  <text class="t-actor" x="1075" y="696">Parceiro</text>

  <!-- Legenda -->
  <rect x="250" y="694" width="18" height="12" rx="3" class="uc-core"/>
  <text class="t-leg" x="276" y="704">Núcleo computacional avançado (Tópicos Avançados)</text>

  <rect x="620" y="694" width="18" height="12" rx="3" class="uc-all"/>
  <text class="t-leg" x="646" y="704">Todos os perfis</text>

  <rect x="740" y="694" width="18" height="12" rx="3" class="uc-cond"/>
  <text class="t-leg" x="766" y="704">Entrega condicional</text>

  <text class="t-leg" x="890" y="704">UC10 e UC11 saíram do escopo na revisão da Sprint 1.</text>
</svg>
